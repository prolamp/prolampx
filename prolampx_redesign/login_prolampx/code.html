<body class="min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-0 overflow-hidden relative">

</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">

<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-ring transition-all placeholder:text-outline/60" id="password" placeholder="••••••••" required="" type="password"/>

<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>

</div>
</div>
<!-- Remember Me -->

</div>

                    Sign In to ProLampX

<script>
        // Micro-interaction for password toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Simple form validation visual feedback
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...`;
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                // Add a small vibration or success state here if it were a real flow
            }, 1500);
        });

        // Parallax effect on mouse move for the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.login-card');
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
